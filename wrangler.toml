name = "ramen-forge"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Top-level keys must come before any [table] header, or TOML nests them inside it.
account_id = "bfbf0f57606c0dfd9fb36bef616d9158"

[observability]
enabled = true

[vars]
# /calibrate upstream. On forge.ramenai.dev, subrequests to api.ramenai.dev (same zone)
# fail with 522, so route to the gateway Worker's workers.dev hostname instead.
RAMEN_GATEWAY_URL = "https://ramen-gateway-worker.ramenai.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "ramen-forge-db"
database_id = "c0cc03e9-69ee-4e03-9798-27747103658f"
migrations_dir = "migrations"

# Legacy full-payload writes require a bearer token; receipt-reference ledger pulls are public.
# Production:  npx wrangler secret put FORGE_WRITE_TOKEN
# Local dev:   put FORGE_WRITE_TOKEN=... in .dev.vars (gitignored)
# Both calibration and public ledger pulls use the server-side RAMEN_API_KEY.
# The private GET /api/v1/exemplars/bounties endpoint requires a bearer FORGE_ADMIN_TOKEN:
# Production:  npx wrangler secret put FORGE_ADMIN_TOKEN

[[routes]]
pattern = "forge.ramenai.dev"
custom_domain = true
