name = "ramen-forge"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "ramen-forge-db"
# Replace with the id printed by `npx wrangler d1 create ramen-forge-db`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Write endpoints (POST /api/v1/exemplars, POST /api/v1/seed) require a bearer token.
# Production:  npx wrangler secret put FORGE_WRITE_TOKEN
# Local dev:   put FORGE_WRITE_TOKEN=... in .dev.vars (gitignored)
